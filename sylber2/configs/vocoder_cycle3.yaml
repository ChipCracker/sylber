# Cycle 3 (Table 7): lr 1e-5, 100K, shuffling acoustics p=0.5
name: sylber2_vocoder_cycle3
seed: 7
model:
  content_ckpt: ???
  content_model_configs: null
  acoustic_configs:
    load_pretrained: true
    hidden_size: 768
    num_layers: 6
  vocoder_configs:
    dim: 1024
    intermediate_dim: 4096
    num_layers: 12
  use_perceptual_loss: true
  freeze_acoustic_encoder: false
  mean_pool_acoustics_prob: 0.1
  shuffle_acoustics_prob: 0.5
  lr: 1.0e-5
  warmup_steps: 5000
  total_steps: 100000
  betas: [0.8, 0.9]
  weight_decay: 0.01
  mel_coef: 45.0
  fm_coef: 1.0
  gan_coef: 1.0
  perceptual_coef: 1.0
data:
  train_sources: ${oc.env:SYLBER2_DATA,/nfs1/scratch/students/witzlch88229/sylber2/data}/manifests/resynth
  source_weights: {fleurs_r: 7.0, default: 1.0}
  batch_size: 12
  num_workers: 12
  dummy_len: 144000
  crop_seconds: 3.0
  perturb_voice_prob: 0.2
  perturb_audio_prob: 0.2
  noise_dir: ${oc.env:SYLBER2_DATA,/nfs1/scratch/students/witzlch88229/sylber2/data}/noise
  rir_dir: ${oc.env:SYLBER2_DATA,/nfs1/scratch/students/witzlch88229/sylber2/data}/rir
max_steps: 100000
checkpoint_every_steps: 10000
warm_start_ckpt: ???
resume_ckpt: null
devices: 1
precision: 32-true
accelerator: gpu
strategy: auto
val_check_interval: 10000
limit_val_batches: 10
