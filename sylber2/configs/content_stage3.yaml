# Stage 3: self-segmentation distillation + boundary detector (BCE)
name: sylber2_stage3
seed: 7
model:
  stage: 3
  speech_upstream: "utter-project/mHuBERT-147"
  load_pretrained: false
  merge_threshold_range: [0.7, 0.9]
  refine_threshold: 0.7
  lr: 1.0e-4
  warmup_steps: 1000
  total_steps: 100000
  betas: [0.9, 0.95]
  weight_decay: 1.0e-2
  loss_coefs:
    distillation_loss: 1.0
    boundary_loss: 1.0
data:
  train_sources: ${oc.env:SYLBER2_DATA,/nfs1/scratch/students/witzlch88229/sylber2/data}/manifests/content
  source_weights: {fleurs: 2.0, default: 1.0}
  batch_size: 13
  num_workers: 12
  dummy_len: 432000
  crop_seconds: 5.0
  both_augmented: false     # stages 2-4: teacher input is clean
  augment_configs:
    noise_dir: ${oc.env:SYLBER2_DATA,/nfs1/scratch/students/witzlch88229/sylber2/data}/noise
    rir_dir: ${oc.env:SYLBER2_DATA,/nfs1/scratch/students/witzlch88229/sylber2/data}/rir
    speech_dir: ${oc.env:SYLBER2_DATA,/nfs1/scratch/students/witzlch88229/sylber2/data}/speech_clips
max_steps: 100000
checkpoint_every_steps: 5000
model_ckpt: ???
resume_ckpt: null
devices: 1
precision: bf16-mixed
accelerator: gpu
strategy: auto
val_check_interval: 5000
limit_val_batches: 10
gradient_clip_val: 0.5
