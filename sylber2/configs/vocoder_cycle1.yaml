# Acoustic encoder + vocoder, Cycle 1 (Table 7): lr 5e-5, 2000K, no perceptual
name: sylber2_vocoder_cycle1
seed: 7
model:
  content_ckpt: ???
  use_perceptual_loss: false
  freeze_acoustic_encoder: false
  mean_pool_acoustics_prob: 0.2
  shuffle_acoustics_prob: 0.0
  lr: 5.0e-5
  warmup_steps: 5000
  total_steps: 2000000
  betas: [0.8, 0.9]
  weight_decay: 0.01
  mel_coef: 45.0
  fm_coef: 1.0
  gan_coef: 1.0
  perceptual_coef: 1.0
data:
  train_sources: ${oc.env:SYLBER2_DATA,/nfs1/scratch/students/witzlch88229/sylber2/data}/manifests/resynth
  source_weights: {fleurs_r: 7.0, default: 1.0}
  batch_size: 12
  num_workers: 12
  dummy_len: 500000
  crop_seconds: 3.0
  perturb_voice_prob: 0.2
  perturb_audio_prob: 0.2
  noise_dir: ${oc.env:SYLBER2_DATA,/nfs1/scratch/students/witzlch88229/sylber2/data}/noise
  rir_dir: ${oc.env:SYLBER2_DATA,/nfs1/scratch/students/witzlch88229/sylber2/data}/rir
max_steps: 2000000
checkpoint_every_steps: 50000
warm_start_ckpt: null
resume_ckpt: null
devices: 1
precision: 32-true
