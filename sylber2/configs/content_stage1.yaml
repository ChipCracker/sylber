# Sylber 2.0 content encoder, Stage 1: frame-wise self-distillation (Table 6)
name: sylber2_stage1
seed: 7
model:
  stage: 1
  speech_upstream: "utter-project/mHuBERT-147"
  load_pretrained: true
  ema_decay: 0.999
  lr: 1.0e-4
  warmup_steps: 2000
  total_steps: 100000
  betas: [0.9, 0.999]
  weight_decay: 1.0e-3
  loss_coefs:
    distillation_loss: 1.0
data:
  train_sources: ${oc.env:SYLBER2_DATA,/nfs1/scratch/students/witzlch88229/sylber2/data}/manifests/content
  source_weights: {fleurs: 2.0, default: 1.0}
  batch_size: 72
  num_workers: 16
  dummy_len: 500000
  crop_seconds: 5.0
  both_augmented: true      # stage 1: teacher input independently augmented
  augment_configs:
    noise_dir: ${oc.env:SYLBER2_DATA,/nfs1/scratch/students/witzlch88229/sylber2/data}/noise
    rir_dir: ${oc.env:SYLBER2_DATA,/nfs1/scratch/students/witzlch88229/sylber2/data}/rir
    speech_dir: ${oc.env:SYLBER2_DATA,/nfs1/scratch/students/witzlch88229/sylber2/data}/speech_clips
max_steps: 100000
checkpoint_every_steps: 25000
model_ckpt: null
resume_ckpt: null
devices: 1
precision: bf16-mixed
accelerator: gpu
strategy: auto
val_check_interval: 5000
limit_val_batches: 10
gradient_clip_val: 0.5
